# Ultralytics ByteTrack configuration customized for CCTV Vehicle Tracking
tracker_type: bytetrack # Tracker backend
track_high_thresh: 0.25 # Threshold for primary high-confidence detections
track_low_thresh: 0.10 # Threshold for secondary association (occluded vehicles)
new_track_thresh: 0.25 # Minimum confidence to spawn a new track
track_buffer: 15 # Retention buffer in frames for lost tracks (MAX_AGE = 15)
match_thresh: 0.75 # Hungarian IoU matching threshold
fuse_score: True # Score fusion for robustness in CCTV scenes
